<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galactic Card Rush</title>
<style>
:root{--y:#ffd54a;--bg:#04060f;--panel:rgba(14,18,38,.82);--line:rgba(255,213,74,.25);--tx:#e8ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#1b1450 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#4a0f2e 0,transparent 45%),radial-gradient(ellipse at 60% 40%,#0a2a4a 0,transparent 55%),var(--bg);color:var(--tx);font-family:'Trebuchet MS',Verdana,sans-serif;overflow-x:hidden}
#bg,#fx{position:fixed;inset:0;pointer-events:none}#bg{z-index:0}#fx{z-index:80}
.planet{position:fixed;right:-90px;top:70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8c93a8,#3a3f55 55%,#10131f 80%);box-shadow:0 0 80px rgba(120,150,255,.25);opacity:.35;z-index:0;pointer-events:none}
.planet:after{content:"";position:absolute;left:62%;top:28%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#222,#555);box-shadow:inset 0 0 12px #000}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:14px}
h1{margin:6px 0 2px;text-align:center;font-size:clamp(26px,6vw,52px);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(#ffe98a,#e0a400);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,40,.45))}
.sub{text-align:center;opacity:.7;letter-spacing:.3em;font-size:11px;text-transform:uppercase;margin-bottom:12px}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.tab{background:var(--panel);border:1px solid var(--line);padding:9px 18px;border-radius:10px;font-weight:700}
.tab.on{background:linear-gradient(#ffd54a,#d99a00);color:#1a1200}
.btn{background:linear-gradient(#ffd54a,#d99a00);color:#1a1200;border:0;border-radius:10px;padding:10px 16px;font-weight:800;box-shadow:0 0 14px rgba(255,200,40,.35)}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:rgba(255,255,255,.1);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pack{background:var(--panel);border:1px solid var(--pc);border-radius:16px;padding:16px;text-align:center;box-shadow:0 0 22px color-mix(in srgb,var(--pc) 35%,transparent);backdrop-filter:blur(6px)}
.pack .em{font-size:64px;filter:drop-shadow(0 0 14px var(--pc));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.pack h3{margin:6px 0;color:var(--pc);letter-spacing:.08em}
.pack details{font-size:12px;text-align:left;margin:8px 0;opacity:.85}.pack summary{cursor:pointer;text-align:center}
.multi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.multi button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:800}
.multi button.on{background:var(--y);color:#111}.multi button.lock{opacity:.3;cursor:not-allowed}
.card{--c:#999;--h:0;position:relative;width:128px;height:182px;border-radius:12px;padding:8px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 40%,#0b0e1c),#0b0e1c 80%);border:2px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;user-select:none}
.card .ic{font-size:54px;line-height:1.1;margin-top:10px;filter:drop-shadow(0 0 10px var(--c));position:relative}
.card .ic:before{content:"";position:absolute;inset:-14px;z-index:-1;background:radial-gradient(circle,hsl(var(--h) 90% 60%/.55),transparent 65%)}
.card .nm{font-weight:800;font-size:13px;line-height:1.1}.card .rt{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--c);font-weight:800}
.card .vl{font-size:11px;opacity:.85}
.card.sh:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:250% 100%;animation:sh 2s linear infinite;mix-blend-mode:overlay;pointer-events:none}
@keyframes sh{from{background-position:150% 0}to{background-position:-100% 0}}
.tag{position:absolute;top:4px;left:4px;font-size:10px;font-weight:900;background:#fff;color:#111;border-radius:6px;padding:1px 5px}
.gem{position:absolute;top:2px;right:4px;font-size:18px;animation:fl 1.4s infinite}
.art svg{width:78px;height:78px;display:block;margin:auto;filter:drop-shadow(0 0 7px rgba(0,0,0,.7))}.cine .art svg{width:160px;height:160px}
.cnt{position:absolute;bottom:4px;right:6px;font-size:11px;font-weight:800;background:#000a;border-radius:6px;padding:0 5px}
.r5{animation:pg 1.6s infinite}.r6{animation:pd 1.2s infinite}
@keyframes pg{50%{box-shadow:0 0 28px var(--c),0 0 50px var(--c)}}
@keyframes pd{50%{box-shadow:0 0 40px #fff,0 0 70px var(--c)}}
.r7{border-color:transparent;background:linear-gradient(#0a0a14,#0a0a14) padding-box,conic-gradient(from 0deg,red,yellow,lime,cyan,blue,magenta,red) border-box;animation:rb 3s linear infinite}
@keyframes rb{to{filter:hue-rotate(360deg)}}
.lockd{filter:brightness(.22) grayscale(1);box-shadow:none}.lockd .ic{filter:blur(2px)}
.sec{margin:0 0 20px}.sec h3{margin:6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:10px}
.cwrap{display:flex;flex-direction:column;gap:4px;align-items:center}.cwrap .btn{padding:4px 8px;font-size:11px;border-radius:7px}
.shop{display:grid;gap:12px;max-width:640px;margin:auto}
.up{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:8px;background:#fff2;border-radius:6px;overflow:hidden;margin-top:6px;width:200px;max-width:100%}.bar i{display:block;height:100%;background:var(--y)}
#ov{position:fixed;inset:0;z-index:70;background:rgba(2,3,10,.88);display:none;overflow:auto;padding:20px;text-align:center}
#ov.show{display:block}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px auto;max-width:900px}
.grid .card{opacity:0;animation:pop .6s forwards}
@keyframes pop{from{opacity:0;transform:rotateY(90deg) scale(.6)}to{opacity:1;transform:none}}
.cine{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative}
.cine .card{width:230px;height:322px;transform:scale(0);animation:big 1s .9s forwards cubic-bezier(.2,1.6,.4,1)}
.cine .card .ic{font-size:104px}.cine .card .nm{font-size:22px}.cine .card .rt{font-size:14px}.cine .card .vl{font-size:15px}
@keyframes big{to{transform:scale(1)}}
.banner{font-size:clamp(28px,7vw,64px);font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--c);text-shadow:0 0 30px var(--c),0 0 60px var(--c);opacity:0;animation:bn 1s .3s forwards}
@keyframes bn{from{opacity:0;transform:scale(2.6);letter-spacing:.8em}to{opacity:1;transform:none}}
.ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:4px solid var(--c);opacity:0;animation:rg 1.8s .8s ease-out infinite}
.ring.b{animation-delay:1.3s}
@keyframes rg{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(40)}}
.flash{position:fixed;inset:0;background:#fff;z-index:90;pointer-events:none;animation:fo 1s forwards}
@keyframes fo{to{opacity:0}}
.shake{animation:sk .5s 4}
@keyframes sk{25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-6px)}75%{transform:translate(-5px,-4px)}}
#modal{position:fixed;inset:0;z-index:95;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.mbox{background:#0c1130;border:2px solid var(--y);border-radius:18px;padding:22px;max-width:440px;text-align:center;box-shadow:0 0 40px rgba(255,200,40,.4)}
.mbox .row{justify-content:center;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;border:1px solid var(--y);padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
#adm{position:fixed;left:10px;bottom:10px;z-index:60;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);opacity:.3;font-size:15px}#adm:hover{opacity:1}
.mbox select,.mbox input[type=text]{background:#0a0e24;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;max-width:100%}.mbox h4{margin:14px 0 4px;color:var(--y)}
.ring{pointer-events:none}.cine .btn{position:relative;z-index:6}
.art{display:block}.art svg{width:58px;height:87px}.cine .art svg{width:130px;height:195px}.card .ic{margin-top:4px}
.hint{opacity:.7;font-size:12px;text-align:center;margin:8px 0 16px}
</style></head>

h+=`<div class="sec"><h3 style="color:${R[r].c}">${R[r].n} <small>${o}/${cs.length}${S.claimed.includes(r)?' ✅ reward claimed':''}</small></h3><div class="row">`;
cs.forEach(c=>{const a=S.inv[c.id];if(!a||a.n+a.s<1){h+=`<div class="card lockd" style="--c:${R[r].c};--h:${c.h}"><div class="ic">❓</div><div><div class="nm">???</div><div class="rt">${R[r].n}</div></div></div>`;return}
const sh=a.s>0&&a.n===0;h+=`<div class="cwrap">${cardH(c,a.s>0,0,`<span class="cnt">×${a.n+a.s}</span>`)}<div class="row" style="gap:4px"><button class="btn alt" onclick="sell(${c.id})">Sell 1</button>${a.n+a.s>1?`<button class="btn" onclick="sellDup(${c.id})">Sell dupes</button>`:''}</div></div>`});
h+='</div></div>'}
h+='<div style="text-align:center"><button class="btn" onclick="sellAllDup()">💰 Sell ALL duplicates</button></div>';m.innerHTML=h}
else{const U=[{k:'luckLv',t:'🍀 Luck Boost',d:'+1% luck per level (rare+ odds)',max:10,cost:l=>3+l*3},
{k:'coinLv',t:'🪙 Coin Boost',d:'+3% sell value per level',max:10,cost:l=>3+l*3},
{k:'multiLv',t:'📦 Multi-Open',d:'+1 pack per open (max 10)',max:9,cost:l=>MULTI_COST[l]}];
let h='<div class="shop">';U.forEach(u=>{const l=S[u.k],mx=l>=u.max;h+=`<div class="up"><div><b>${u.t}</b> — Lv ${l}/${u.max}<div style="font-size:12px;opacity:.75">${u.d}</div><div class="bar"><i style="width:${l/u.max*100}%"></i></div></div><button class="btn" ${mx||S.gems<u.cost(l)?'disabled':''} onclick="buy('${u.k}')">${mx?'MAX':'💎 '+u.cost(l)}</button></div>`});
m.innerHTML=h+'<div style="text-align:center"><button class="btn alt" onclick="resetAll()">Reset progress</button></div></div>'}}
function setSel(i){if(i>maxM())return toast('Unlock more in the Gem Shop 💎');S.sel=i;save();render()}
function buy(k){const u={luckLv:l=>3+l*3,coinLv:l=>3+l*3,multiLv:l=>MULTI_COST[l]}[k],c=u(S[k]);if(S.gems<c)return;S.gems-=c;S[k]++;save();render();toast('Upgrade purchased!')}
function resetAll(){if(confirm('Reset all progress?')){S=def();save();render()}}
function pick(w){let s=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<w.length;i++){s-=w[i];if(s<0)return i}return 0}
const freeLeft=()=>Math.max(0,Math.ceil(((S.lastFree||0)+10000-Date.now())/1000));
function openPack(pi){const p=P[pi],n=p.free?1:Math.min(S.sel,maxM());if(p.free){const t=S.admin?0:freeLeft();if(t>0)return toast('Free pack ready in '+t+'s');S.lastFree=Date.now()}if(S.coins<p.cost*n)return toast('Not enough coins!');
S.coins-=p.cost*n;const w=p.w.map((x,i)=>i>=2?x*luckM():x),res=[];
for(let i=0;i<n;i++){const r=(S.admin&&S.force>=0)?S.force:pick(w),pool=CARDS.filter(c=>c.r===r),c=pool[Math.floor(Math.random()*pool.length)];
const sh=Math.random()<.08,gem=r>=2&&r<=4&&Math.random()<.12,dup=tot(c.id)>0;
const a=S.inv[c.id]||(S.inv[c.id]={n:0,s:0});sh?a.s++:a.n++;if(gem)S.gems++;res.push({c,sh,gem,dup})}
S.opened+=n;save();hud();play(res)}
function play(res){const best=res.reduce((a,b)=>b.c.r>a.c.r?b:a);warp=40;const ov=$('#ov');ov.classList.add('show');ov.scrollTop=0;
const done=()=>grid(res);
if(best.c.r>=4){ov.innerHTML='';setTimeout(()=>cine(best,done),600)}else{ov.innerHTML='';setTimeout(done,700)}}
const TITLES=['','','','','Legendary Pull!','GODLY!!','Divine Ascension','⚠ SECRET FOUND ⚠'];
function cine(x,next){const k=R[x.c.r],ov=$('#ov');
ov.innerHTML=`<div class="cine" style="--c:${k.c}"><div class="ring"></div><div class="ring b"></div><div class="banner">${TITLES[x.c.r]}</div>${cardH(x.c,x.sh,x.gem)}<button class="btn" onclick="this.disabled=true;window.nx()">Continue ➜</button></div>`;
window.nx=()=>{window.nx=()=>{};next()};
const big=x.c.r>=5;if(big){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),2200);
const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
const cols=x.c.r===7?['#f0f','#0ff','#ff0','#0f0','#f55']:[k.c,'#fff'];
[900,1500,2200].slice(0,x.c.r>=6?3:big?2:1).forEach(t=>setTimeout(()=>burst(innerWidth/2,innerHeight/2,x.c.r>=6?220:130,cols),t));
if(x.c.r>=6)burstLoop=setInterval(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,50,cols),450);}
let burstLoop;
function grid(res){clearInterval(burstLoop);const dupV=res.filter(x=>x.dup).reduce((a,x)=>a+val(x.c,x.sh),0),gems=res.filter(x=>x.gem).length;
$('#ov').innerHTML=`<h2 style="color:var(--y);letter-spacing:.2em;margin:10px">YOUR PULLS</h2>${gems?`<div>💎 +${gems} gem${gems>1?'s':''}!</div>`:''}<div class="grid">${res.map((x,i)=>cardH(x.c,x.sh,x.gem).replace('class="card','style_="" class="card').replace('style="--c','style="animation-delay:'+i*.15+'s;--c')).join('')}</div>
<div class="row" style="justify-content:center"><button class="btn" onclick="closeOv()">Keep all</button>${dupV?`<button class="btn alt" id="sd">Sell duplicates (+🪙 ${fmt(dupV)})</button>`:''}</div>`;
window.lastRes=res;const sd=$('#sd');if(sd)sd.onclick=()=>{res.filter(x=>x.dup).forEach(x=>rem(x.c.id,x.sh));S.coins+=dupV;save();closeOv();toast('Sold for 🪙 '+fmt(dupV))};
res.forEach(x=>{if(x.c.r>=4)burst(innerWidth/2,innerHeight/3,40,[R[x.c.r].c])})}
function closeOv(){$('#ov').classList.remove('show');render();checkDone()}
function rem(id,sh){const a=S.inv[id];if(!a)return;if(sh&&a.s>0)a.s--;else if(a.n>0)a.n--;else if(a.s>0)a.s--}
function sell(id){const a=S.inv[id],c=CARDS[id];if(!a||a.n+a.s<1)return;const sh=a.n===0;S.coins+=val(c,sh);rem(id,sh);save();render()}
function sellDup(id){const a=S.inv[id],c=CARDS[id];let g=0;while(a.n+a.s>1){const sh=a.n===0;g+=val(c,sh);rem(id,sh)}S.coins+=g;save();render();toast('+🪙 '+fmt(g))}
function sellAllDup(){let g=0;CARDS.forEach(c=>{const a=S.inv[c.id];if(!a)return;while(a.n+a.s>1){const sh=a.n===0;g+=val(c,sh);rem(c.id,sh)}});S.coins+=g;save();render();toast(g?'+🪙 '+fmt(g):'No duplicates')}
function checkDone(){for(let r=0;r<8;r++){if(S.claimed.includes(r))continue;if(CARDS.filter(c=>c.r===r).every(c=>tot(c.id)>0)){
const coins=R[r].v*50;$('#modal').innerHTML=`<div class="mbox"><h2 style="color:${R[r].c};margin-top:0">${R[r].n} Set Complete!</h2><p>You collected every ${R[r].n} card. Choose your reward:</p><div class="row"><button class="btn" onclick="claim(${r},1)">🍀 +10% Luck</button><button class="btn" onclick="claim(${r},0)">🪙 +${fmt(coins)} Coins</button></div></div>`;$('#modal').classList.add('show');burst(innerWidth/2,innerHeight/2,150,[R[r].c,'#fff']);return}}}
function claim(r,l){S.claimed.push(r);l?S.bonus+=.1:S.coins+=R[r].v*50;save();$('#modal').classList.remove('show');render();toast(l?'Luck increased!':'Coins added!');setTimeout(checkDone,300)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
/* Admin */
function admOpen(){const m=$('#modal');if(S.admin)return admPanel();m.innerHTML=`<div class="mbox"><h3 style="margin-top:0">🔒 Enter code</h3><input type="text" id="ac" autocomplete="off" placeholder="secret code"><div class="row"><button class="btn" onclick="admCheck()">Unlock</button><button class="btn alt" onclick="admClose()">Cancel</button></div></div>`;m.classList.add('show');setTimeout(()=>{const i=$('#ac');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')admCheck()}}},50)}
function admCheck(){if(($('#ac').value||'').trim().toLowerCase()==='cocoteddy'){S.admin=true;save();toast('Admin unlocked 👑');admPanel()}else toast('Wrong code')}
function admClose(){$('#modal').classList.remove('show');render()}
function admPanel(){const opts=CARDS.map(c=>`<option value="${c.id}">${R[c.r].n} · ${c.n}</option>`).join(''),ro=R.map((r,i)=>`<option value="${i}">${r.n}</option>`).join('');
$('#modal').innerHTML=`<div class="mbox" style="max-height:90vh;overflow:auto"><h3 style="margin-top:0">👑 Admin Panel</h3>
<h4>Resources</h4><div class="row"><button class="btn" onclick="adm('coins')">+1M 🪙</button><button class="btn" onclick="adm('gems')">+1000 💎</button><button class="btn" onclick="adm('max')">Max upgrades</button></div>
<h4>Cards</h4><div class="row"><select id="ag">${opts}</select><label><input type="checkbox" id="as"> shiny</label><button class="btn" onclick="adm('give')">Give card</button></div><div class="row"><button class="btn" onclick="adm('all')">Unlock all cards</button><button class="btn alt" onclick="adm('clear')">Clear collection</button></div>
<h4>Rigged pulls</h4><div class="row"><select id="af"><option value="-1">Normal odds</option>${ro}</select><button class="btn" onclick="adm('force')">Set guaranteed rarity</button></div><div style="font-size:12px;opacity:.7">Also removes the free-pack cooldown.</div>
<div class="row"><button class="btn" onclick="admClose()">Close</button><button class="btn alt" onclick="adm('off')">Lock admin</button></div></div>`;$('#modal').classList.add('show');const f=$('#af');if(f)f.value=S.force>=0?S.force:-1}
function adm(k){if(!S.admin)return;
if(k==='coins')S.coins+=1e6;else if(k==='gems')S.gems+=1000;else if(k==='max'){S.luckLv=10;S.coinLv=10;S.multiLv=9}
else if(k==='give'){const id=+$('#ag').value,a=S.inv[id]||(S.inv[id]={n:0,s:0});$('#as').checked?a.s++:a.n++}
else if(k==='all')CARDS.forEach(c=>{if(!tot(c.id))S.inv[c.id]={n:1,s:0}});
else if(k==='clear'){if(!confirm('Clear all cards?'))return;S.inv={};S.claimed=[]}
else if(k==='force'){S.force=+$('#af').value}
else if(k==='off'){S.admin=false;S.force=-1;save();admClose();return toast('Admin locked')}
save();hud();toast('Done ✅');if(k==='all'){admClose();checkDone()}}
/* Starfield + particles */
const bg=$('#bg'),g=bg.getContext('2d'),fx=$('#fx'),f=fx.getContext('2d');let W,H,warp=1;const stars=[],parts=[];
function rs(){W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<420;i++)stars.push({x:(Math.random()*2-1)*W,y:(Math.random()*2-1)*H,z:Math.random()*W,t:Math.random()*360});
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:cols[i%cols.length],s:2+Math.random()*3})}}
function loop(){g.fillStyle='rgba(4,6,15,.35)';g.fillRect(0,0,W,H);const sp=1.2*warp;
stars.forEach(s=>{const pz=s.z;s.z-=sp;if(s.z<1){s.x=(Math.random()*2-1)*W;s.y=(Math.random()*2-1)*H;s.z=W;return}
const k=W/2/s.z,px=W/2+s.x*k,py=H/2+s.y*k,qk=W/2/(pz+sp*.5),qx=W/2+s.x*qk,qy=H/2+s.y*qk,a=1-s.z/W;
g.strokeStyle=`hsla(${s.t>300?200:s.t>200?40:0},${s.t>200?60:0}%,90%,${a})`;g.lineWidth=a*2.2+.3;g.beginPath();g.moveTo(qx,qy);g.lineTo(px,py);g.stroke()});
warp+=(1-warp)*.04;
f.clearRect(0,0,W,H);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.l-=.012;if(p.l<=0){parts.splice(i,1);continue}f.globalAlpha=p.l;f.fillStyle=p.c;f.shadowColor=p.c;f.shadowBlur=10;f.beginPath();f.arc(p.x,p.y,p.s,0,6.283);f.fill()}f.globalAlpha=1;f.shadowBlur=0;
requestAnimationFrame(loop)}
loop();render();
setInterval(()=>{const b=document.getElementById('fb');if(!b)return;const t=S.admin?0:freeLeft();b.disabled=t>0;b.textContent=t>0?'Ready in '+t+'s':'Claim free pack'},250);

</script></body></html>
